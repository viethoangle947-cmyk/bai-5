<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Setting</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
</head>
<body>
    <div class="app-wrapper">
    <aside class ="aside">
        <div class ="menu">
                <a href="#" class="nav-item active"><img src="./picture/27.svg" alt="home"></a>
                <a href="#" class="nav-item action"><img src="./picture/28.svg" alt="analytics"></a>
                <a href="#" class="nav-item"><img src="./picture/29.svg" alt="awards"></a>
                <a href="#" class="nav-item"><img src="./picture/30.svg" alt="messages"></a>
                <a href="#" class="nav-item"><img src="./picture/31.svg" alt="settings"></a>
            </div>
            </aside>
        <main class="main-content">
            <header class="top-header">
                <div class="aside2">
                    <h2 class="h2">Welcome, Amanda</h2>
                    <p class="p">Tue, 07 June 2022</p>
                </div>

                <div class="header-right">
                    <div class="t">
                        <img src="./picture/32.svg" alt="search" class="search-icon">
                        <input type="text" placeholder="Search">
                    </div>
                    <div class="ot">
                        <img src="./picture/33.svg" alt="bell">
                    </div>
                    <div class="avatar">
                        <img src="./picture/26.svg" alt="user">
                    </div>
                </div>
            </header>
            <div class="content-body">
                <div class="cover-photo">
                </div>
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="user-info">
                            <img src="./picture/34.svg" alt="Alexa Rawles" class="profile-avatar">
                            <div class="user-details">
                                <h3>Alexa Rawles</h3>
                                <p>alexarawles@gmail.com</p>
                            </div>
                        </div>
                        <button class="btn-edit">Edit</button>
                    </div>

                    <div class="profile-form">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" placeholder="Your First Name">
                        </div>

                        <div class="form-group">
                            <label>Nick name</label>
                            <input type="text" placeholder="Your Nick Name">
                        </div>

                        <div class="form-group">
                            <label>Gender</label>
                            <div class="select-wrapper">
                                <select>
                                    <option value=""disabled selected hidden>Your Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                                <img src="./picture/16.png" alt="arrow" class="select-arrow">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Country</label>
                            <div class="select-wrapper">
                                <select>
                                    <option value=""disabled selected hidden>Your Country</option>
                                    <option value="us">United States</option>
                                    <option value="vn">Vietnam</option>
                                </select>
                                <img src="./picture/16.png" alt="arrow" class="select-arrow">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Language</label>
                            <div class="select-wrapper">
                                <select>
                                    <option value=""disabled selected hidden>Your Language</option>
                                    <option value="en">English</option>
                                    <option value="vi">Vietnamese</option>   
                                </select>
                                <img src="./picture/16.png" alt="arrow" class="select-arrow">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Time Zone</label>
                            <div class="select-wrapper">
                                <select>
                                    <option value=""disabled selected hidden>Your Time Zone</option>
                                    <option value="utc7">GMT +7</option>
                                    <option value="utc0">GMT +99</option>
                                </select>
                                <img src="./picture/16.png" alt="arrow" class="select-arrow">
                            </div>
                        </div>
                    </div>

                    <div class="email-section">
                        <h4>My email Address</h4>
                        <div class="email-item">
                            <div class="email-icon">
                                <img src="./picture/10.png" alt="mess">
                            </div>
                            <div class="email-info">
                                <p class="email-text">alexarawles@gmail.com</p>
                                <span class="email-time">1 month ago</span>
                            </div>
                        </div>
                        <button class="btn-add-email">+Add Email Address</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
